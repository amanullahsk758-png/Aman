name: Build DKart Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DKart APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment & Secrets
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DKart Debug,O=DKart,C=IN"
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename and Organize APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/DKart-Marketplace.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DKart-Marketplace-APK
          path: release-apk/DKart-Marketplace.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "DKart Marketplace APK v1.0.0"
          body: |
            ### 🛒 DKart Multi-Vendor E-Commerce Marketplace APK
            Direct download link for your mobile device:
            - **App Name**: DKart
            - **Package**: `com.aistudio.bharatbazaar.qkmpvz`
            - **Platform**: Android 7.0+ (API 24 to 36)
            
            **Direct Download**: Download `DKart-Marketplace.apk` below directly to your phone and install!
          files: release-apk/DKart-Marketplace.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "### 🚀 DKart APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "Your **DKart Marketplace APK** is ready to download and install on your mobile device." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📲 How to Download & Install:" >> $GITHUB_STEP_SUMMARY
          echo "1. **Method 1 (Direct Release)**: Go to the GitHub repository homepage and check the **Releases** tab on the right side." >> $GITHUB_STEP_SUMMARY
          echo "2. **Method 2 (Artifacts)**: Click on the **Actions** tab -> select this run -> scroll down to **Artifacts** -> click **DKart-Marketplace-APK** to download." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: DKart Multi-Vendor Marketplace" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: DKart-Marketplace.apk" >> $GITHUB_STEP_SUMMARY
